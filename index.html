<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3B36">
<title>Moona Care</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#2E3B36; --gold:#C9A46A; --cream:#FAF7F2;
  --bg:#FAF7F2; --surface:#FFFFFF; --raised:#F2EDE4; --line:#E3DBCD;
  --text:#2E3B36; --mute:#7C8A83;
  --leaf:#5F8C72; --clay:#C2705C; --dusk:#7B86AE;
  --pad:16px;
}
body.night{
  --bg:#131C18; --surface:#1B2621; --raised:#222E28; --line:#2E3D35;
  --text:#EDE3D2; --mute:#8B978D; --cream:#EDE3D2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Kantumruy Pro',system-ui,sans-serif; font-size:15px; line-height:1.5;
  padding-bottom:92px; -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
.serif{font-family:'Fraunces',Georgia,serif}
.wrap{max-width:520px;margin:0 auto;padding:0 var(--pad)}
.hide{display:none!important}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;padding:0 var(--pad) 48px}
#auth .inner{max-width:400px;margin:0 auto;padding-top:11vh}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo .glyph{width:42px;height:42px;border-radius:50%;background:var(--sage);position:relative;flex:none}
.logo .glyph:after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:var(--gold);top:2px;right:-2px;
  -webkit-mask:radial-gradient(circle at 2px 50%,transparent 13px,#000 13.5px);mask:radial-gradient(circle at 2px 50%,transparent 13px,#000 13.5px)}
.logo h1{font-family:'Fraunces',serif;font-size:25px;font-weight:600;margin:0;letter-spacing:-.02em}
.logo p{margin:0;font-size:11.5px;color:var(--mute);letter-spacing:.04em}
h2.big{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0 0 6px;letter-spacing:-.02em;line-height:1.2}
p.lede{color:var(--mute);font-size:13.5px;margin:0 0 22px;line-height:1.6}

label.f{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:13px;font-family:inherit;font-size:15.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{width:100%;background:var(--sage);color:var(--cream);border:0;border-radius:13px;padding:15px;
  font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:18px}
body.night .btn{background:var(--gold);color:#16211D}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:10px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--mute);font-family:inherit;font-size:13px;text-decoration:underline;
  cursor:pointer;display:block;margin:18px auto 0;padding:6px}
.err{background:rgba(194,112,92,.12);border:1px solid var(--clay);color:var(--clay);border-radius:11px;
  padding:11px;font-size:13px;margin-top:14px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:9px;padding:16px 0 6px}
header .who{flex:1;min-width:0}
header .who h1{font-family:'Fraunces',serif;margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who p{margin:0;font-size:11.5px;color:var(--mute)}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;
  padding:7px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;flex:none}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--leaf);display:inline-block;margin-right:5px;vertical-align:1px}
.live-dot.off{background:var(--clay)}

/* ---------- hero ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 18px 16px}
.dial{position:relative;width:186px;height:186px;margin:0 auto}
.dial svg{transform:rotate(-90deg);display:block}
.dial .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 26px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.dial .big{font-family:'Fraunces',serif;font-size:44px;font-weight:600;line-height:1;margin:5px 0 3px;letter-spacing:-.035em}
.dial .sub{font-size:11.5px;color:var(--mute);line-height:1.35}
.pill{display:inline-block;margin-top:7px;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;
  background:rgba(201,164,106,.18);color:#8A6E38}
body.night .pill{color:var(--gold)}
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.glance div{background:var(--raised);border-radius:13px;padding:9px 6px;text-align:center}
.glance b{display:block;font-family:'Fraunces',serif;font-size:18px;font-weight:600;letter-spacing:-.02em}
.glance span{font-size:10px;color:var(--mute);display:block;margin-top:1px}

.taps{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.tap{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:19px;padding:15px 14px;
  text-align:left;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:74px;justify-content:center}
.tap:active{transform:scale(.97)}
.tap .t{font-size:15.5px;font-weight:600}
.tap .s{font-size:11px;color:var(--mute)}
.tap.on{border-color:var(--gold);background:rgba(201,164,106,.1)}
.tap.on .s{color:#8A6E38;font-weight:600}
body.night .tap.on .s{color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}

h2.sec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:24px 0 9px;
  font-weight:600;display:flex;align-items:center;gap:8px}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:13px}

.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:33px;height:33px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:15px;background:var(--raised)}
.row .bd{flex:1;min-width:0}
.row .bd b{display:block;font-size:14px;font-weight:600}
.row .bd span{font-size:11px;color:var(--mute)}
.row .rt{font-size:11.5px;color:var(--mute);text-align:right;flex:none;font-family:'Fraunces',serif}
.by{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--raised);color:var(--mute);margin-left:6px;vertical-align:1.5px}
.empty{text-align:center;padding:24px 10px;color:var(--mute);font-size:12.5px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:3px;font-weight:600}

/* ---------- milk label card (signature) ---------- */
.tag{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:9px;
  display:flex;gap:13px;align-items:stretch;overflow:hidden}
.tag.spent{opacity:.45}
.tag .phase{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-right:1px dashed var(--line);padding-right:12px}
.tag .phase .sym{font-size:21px;line-height:1}
.tag .phase .lb{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:4px;text-align:center}
.tag .main{flex:1;min-width:0}
.tag .no{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:.02em}
.tag .no small{font-size:12px;color:var(--mute);font-weight:400;margin-left:5px;letter-spacing:0}
.tag .meta{font-size:11.5px;color:var(--mute);margin-top:2px}
.tag .life{margin-top:8px}
.bar{height:5px;border-radius:3px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--leaf);transition:width .3s}
.bar.warn i{background:var(--gold)} .bar.bad i{background:var(--clay)}
.lifeTxt{font-size:10.5px;color:var(--mute);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.tag .acts{display:flex;flex-direction:column;gap:5px;justify-content:center;flex:none}
.mini{border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:9px;padding:6px 9px;
  font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap}
.mini:active{transform:scale(.95)}
.mini.warn{color:var(--clay)}
.first{border:1px dashed var(--leaf);color:var(--leaf);border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:12px}
.sumline{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sumline div{background:var(--raised);border-radius:13px;padding:10px;text-align:center}
.sumline b{display:block;font-family:'Fraunces',serif;font-size:19px;font-weight:600}
.sumline span{font-size:10px;color:var(--mute)}

/* printable label */
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important;position:static}
  .plabel{width:70mm;border:1.2pt dashed #444;border-radius:4mm;padding:5mm;margin:0 0 6mm;font-family:Georgia,serif;color:#000}
  .plabel .pn{font-size:20pt;font-weight:700}
  .plabel .pr{font-size:10pt;margin-top:1.5mm}
}

/* ---------- NSSF visits ---------- */
.sumline.three{grid-template-columns:repeat(3,1fr)}
.sumline.three b{font-size:17px}
.nv{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  margin-bottom:8px;width:100%;text-align:left;font-family:inherit;color:var(--text);overflow:hidden}
.nvmain{display:flex;gap:12px;align-items:center;padding:12px 13px;cursor:pointer;width:100%;
  background:none;border:0;font-family:inherit;color:inherit;text-align:left}
.nvmain:active{opacity:.7}
.nvact{display:flex;gap:7px;padding:0 13px 12px}
.nvact button{flex:1;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:10px;
  padding:9px 6px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer}
.nvact button:active{transform:scale(.97)}
.nvact button.go{border-color:var(--leaf);color:var(--leaf)}
.nvact button.no{border-color:var(--line);color:var(--mute)}
.nv.open{border-color:var(--gold);background:rgba(201,164,106,.09)}
.nv.miss{border-color:var(--clay)}
.nv.gone{opacity:.5}
.nv .seq{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-family:'Fraunces',serif;font-size:14px;font-weight:600;background:var(--raised);color:var(--mute)}
.nv.gone .seq{background:var(--leaf);color:#fff}
.nv .mn{flex:1;min-width:0}
.nv .mn b{display:block;font-size:13.5px;font-weight:600}
.nv .mn span{font-size:11px;color:var(--mute)}
.nv .amt{font-family:'Fraunces',serif;font-size:15px;font-weight:600;flex:none}
.st{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:6px;white-space:nowrap}
.st.now{background:rgba(201,164,106,.22);color:#8A6E38}
body.night .st.now{color:var(--gold)}
.st.miss{background:rgba(194,112,92,.15);color:var(--clay)}
.st.est{background:var(--raised);color:var(--mute)}
.st.ok{background:rgba(95,140,114,.16);color:var(--leaf)}

/* ---------- vaccines ---------- */
.vx{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.vx:last-child{border-bottom:0}
.tick{width:25px;height:25px;border-radius:8px;border:1.5px solid var(--line);background:transparent;flex:none;
  cursor:pointer;display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px}
.tick.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.vx .in{flex:1;min-width:0}
.vx .in b{font-size:13.5px;font-weight:600;display:block}
.vx .in span{font-size:11px;color:var(--mute)}
.vx.done .in b{color:var(--mute);text-decoration:line-through}
.tg{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:6px}
.tg.due{background:rgba(194,112,92,.15);color:var(--clay)}
.tg.soon{background:rgba(201,164,106,.2);color:#8A6E38}
body.night .tg.soon{color:var(--gold)}

.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:12px;
  padding:13px 4px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--sage);border-color:var(--sage);color:var(--cream)}
body.night .seg button.on{background:var(--gold);color:#16211D}
.legal{display:block;text-align:center;font-size:12.5px;color:var(--mute);padding:7px;text-decoration:underline}
.note{font-size:11px;color:var(--mute);line-height:1.55;margin-top:10px}

/* ---------- sheet / nav / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,28,24,.55);backdrop-filter:blur(3px);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);
  border-radius:24px 24px 0 0;padding:8px 18px 32px;max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.3,.8,.4,1);max-width:520px;margin:0 auto}
.sheet.open{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-family:'Fraunces',serif;margin:0 0 3px;font-size:20px;font-weight:600}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:var(--mute);font-family:inherit;font-size:10px;font-weight:600;
  cursor:pointer;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic2{font-size:16px;line-height:1}
nav button.on{color:var(--sage)}
body.night nav button.on{color:var(--gold)}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(18px);bottom:92px;z-index:60;background:var(--sage);
  color:var(--cream);border-radius:13px;padding:11px 15px;font-size:13px;display:flex;align-items:center;gap:12px;
  opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.22);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--gold);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="auth">
  <div class="inner">
    <div class="logo"><div class="glyph"></div>
      <div><h1>Moona Care</h1><p id="tagline">Gentle Care, Growing Love</p></div></div>
    <div id="authBody"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="wrap hide" id="app">
  <header>
    <div class="who"><h1 id="babyName">Baby</h1><p id="babySub"></p></div>
    <button class="chip" id="langBtn">EN</button>
    <button class="chip" id="nightBtn">☾</button>
  </header>

  <section id="t-today">
    <div class="hero">
      <div class="dial">
        <svg width="186" height="186" viewBox="0 0 186 186">
          <circle cx="93" cy="93" r="82" fill="none" stroke="var(--raised)" stroke-width="9"/>
          <circle id="arc" cx="93" cy="93" r="82" fill="none" stroke="var(--gold)" stroke-width="9"
                  stroke-linecap="round" stroke-dasharray="515.2" stroke-dashoffset="515.2"/>
        </svg>
        <div class="face">
          <div class="eyebrow" data-t="sinceFeed"></div>
          <div class="big" id="sinceBig">—</div>
          <div class="sub" id="sinceSub"></div>
          <div class="pill hide" id="sidePill"></div>
        </div>
      </div>
      <div class="glance">
        <div><b id="gF">0</b><span data-t="feedsToday"></span></div>
        <div><b id="gD">0</b><span data-t="diapersToday"></span></div>
        <div><b id="gS">0h</b><span data-t="sleepToday"></span></div>
      </div>
    </div>

    <div class="taps">
      <button class="tap" id="bFeed"><span class="t"><i class="dot" style="background:var(--gold)"></i><span data-t="feed"></span></span><span class="s" data-t="tapStart"></span></button>
      <button class="tap" id="bSleep"><span class="t"><i class="dot" style="background:var(--dusk)"></i><span data-t="sleep"></span></span><span class="s" data-t="tapStart"></span></button>
      <button class="tap" id="bDiaper"><span class="t"><i class="dot" style="background:var(--leaf)"></i><span data-t="diaper"></span></span><span class="s" data-t="tapLog"></span></button>
      <button class="tap" id="bPump"><span class="t"><i class="dot" style="background:var(--clay)"></i><span data-t="pump"></span></span><span class="s" data-t="tapLog"></span></button>
    </div>

    <h2 class="sec"><span data-t="upNext"></span></h2>
    <div class="card" id="nextCard"></div>
    <h2 class="sec"><span data-t="todayLog"></span></h2>
    <div class="card" id="logCard"></div>
    <button class="btn ghost" id="copyBtn" data-t="copyDay"></button>
  </section>

  <section id="t-milk" class="hide">
    <h2 class="sec"><span data-t="milkStore"></span></h2>
    <div class="sumline">
      <div><b id="mTot">0</b><span data-t="mlStored"></span></div>
      <div><b id="mCnt">0</b><span data-t="bagsStored"></span></div>
    </div>
    <div id="stashList"></div>
    <button class="btn ghost" id="addMilkBtn" data-t="addMilk"></button>
    <div class="note" data-t="milkNote"></div>
  </section>

  <section id="t-vax" class="hide">
    <h2 class="sec"><span data-t="vaccines"></span></h2>
    <div class="card" id="vaxCard"></div>
    <h2 class="sec"><span data-t="appts"></span></h2>
    <div class="card" id="apptCard"></div>
    <button class="btn ghost" id="addApptBtn" data-t="addAppt"></button>
    <div class="note" data-t="vaxNote"></div>
  </section>

  <section id="t-nssf" class="hide">
    <h2 class="sec"><span data-t="nssfTitle"></span></h2>
    <div class="sumline three">
      <div><b id="nGot">$0</b><span data-t="received"></span></div>
      <div><b id="nSoon">$0</b><span data-t="stillToCome"></span></div>
      <div><b id="nLost">$0</b><span data-t="missedAmt"></span></div>
    </div>
    <div id="nssfList"></div>
    <button class="btn" id="addNssf" data-t="addVisits"></button>
    <div class="note" data-t="nssfNote"></div>
  </section>

  <section id="t-health" class="hide">
    <h2 class="sec"><span data-t="medTemp"></span></h2>
    <div class="card" id="medCard"></div>
    <div class="taps" style="margin-top:9px">
      <button class="tap" id="bTemp"><span class="t">🌡️ <span data-t="temp"></span></span><span class="s" data-t="tapLog"></span></button>
      <button class="tap" id="bMed"><span class="t">💊 <span data-t="medicine"></span></span><span class="s" data-t="tapLog"></span></button>
    </div>
    <h2 class="sec"><span data-t="growth"></span></h2>
    <div class="card" id="growthCard"></div>
    <button class="btn ghost" id="addGrowthBtn" data-t="addGrowth"></button>
  </section>

  <section id="t-set" class="hide">
    <h2 class="sec"><span data-t="family"></span></h2>
    <div class="card">
      <div class="row" style="padding-top:0">
        <div class="ic">👨‍👩‍👧</div>
        <div class="bd"><b id="inviteCode">—</b><span data-t="inviteL"></span></div>

/* status of one NSSF visit: done | open | soon | missed */
function nvState(v){
  if(v.done_at) return 'done';
  if(v.skipped) return 'missed';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(v.due_date+'T00:00:00');
  const end = new Date((v.window_end||v.due_date)+'T00:00:00');
  if(today > end) return 'missed';
  if(today >= due) return 'open';
  return 'soon';
}

function authView(mode){
  const signup = mode==='signup';
  $('authBody').innerHTML = `
    <h2 class="big">${signup? t('welcomeNew') : t('welcome')}</h2>
    <p class="lede">${t('authLede')}</p>
    ${signup? `<label class="f">${t('yourName')}</label><input id="aName" placeholder="Sokha">`:''}
    <label class="f">${t('email')}</label><input id="aEmail" type="email" inputmode="email" autocomplete="email">
    <label class="f">${t('password')}</label><input id="aPass" type="password" autocomplete="${signup?'new-password':'current-password'}">
    <button class="btn" id="aGo">${signup? t('signUp') : t('signIn')}</button>
    <button class="link" id="aSwap">${signup? t('haveAcct') : t('noAcct')}</button>
    <div id="aErr"></div>`;
  $('aSwap').onclick = ()=>authView(signup?'signin':'signup');
  $('aGo').onclick = async ()=>{
    const email=$('aEmail').value.trim(), pass=$('aPass').value;
    if(!email||!pass) return;
    $('aGo').disabled=true;
    try{
      if(signup){
        const name=$('aName').value.trim()||'Parent';
        const {error} = await sb.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
        if(error) throw error;
        const {error:e2} = await sb.auth.signInWithPassword({email,password:pass});
        if(e2){ $('aErr').innerHTML=`<div class="err">${t('checkEmail')}</div>`; $('aGo').disabled=false; return; }
      } else {
        const {error} = await sb.auth.signInWithPassword({email,password:pass});
        if(error) throw error;
      }
      await boot();
    }catch(err){
      $('aErr').innerHTML=`<div class="err">${esc(err.message||'Error')}</div>`;
      $('aGo').disabled=false;
    }
  };
}

async function loadAll(){
  const [ev, mk, vx, ap, gr, ns] = await Promise.all([
    sb.from('events').select('*').eq('baby_id',BABY.id).order('at',{ascending:false}).limit(400),
    sb.from('milk_batches').select('*').eq('baby_id',BABY.id).is('used_at',null).order('expressed_at'),
    sb.from('vaccinations').select('*').eq('baby_id',BABY.id),
    sb.from('appointments').select('*').eq('baby_id',BABY.id).order('at'),
    sb.from('growth').select('*').eq('baby_id',BABY.id).order('at',{ascending:false}),
    sb.from('nssf_visits').select('*').eq('baby_id',BABY.id).order('due_date')
  ]);
  EV = ev.data||[]; MILK = mk.data||[]; APPTS = ap.data||[]; GROWTH = gr.data||[]; NSSF = ns.data||[];
  VAX_DONE = {}; (vx.data||[]).forEach(v=>VAX_DONE[v.code]=v.given_at);
}
async function addEvent(row){
  const rec = Object.assign({family_id:FAM.id, baby_id:BABY.id, by_user:ME.id, by_name:PROFILE.display_name}, row);
  const {data,error} = await sb.from('events').insert(rec).select().single();
  if(error){ toast(error.message); return; }
  EV.unshift(data); paint();
  toast(t('saved'), t('undo'), async ()=>{
    await sb.from('events').delete().eq('id',data.id);
    EV = EV.filter(e=>e.id!==data.id); paint();
  });
}
function watch(){
  sb.channel('fam-'+FAM.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'events',filter:'family_id=eq.'+FAM.id}, refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'milk_batches',filter:'family_id=eq.'+FAM.id}, refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'vaccinations',filter:'family_id=eq.'+FAM.id}, refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'nssf_visits',filter:'family_id=eq.'+FAM.id}, refresh)

}

function age(){
  if(!BABY.dob) return t('addDob');
  const d=Math.floor((now()-ts(BABY.dob+'T00:00:00'))/DAY);
  if(d<0) return '';
  if(d<31) return d+' '+(LANG==='kh'?'ថ្ងៃ':'days')+' '+t('old');
  const mo=Math.floor(d/30.44);
  if(mo<24) return mo+' '+(LANG==='kh'?'ខែ':'months')+' '+t('old');
  return Math.floor(mo/12)+' '+(LANG==='kh'?'ឆ្នាំ':'years')+' '+t('old');
}

function paintHero(){
  const f=lastOf('feed'), arc=$('arc'), C=2*Math.PI*82;
  if(!f){
    $('sinceBig').textContent='—'; $('sinceSub').textContent=t('noFeed');
    $('sidePill').classList.add('hide'); arc.style.strokeDashoffset=C;
  }else{
    const el=now()-ts(f.at);
    $('sinceBig').textContent=durS(el);
    $('sinceSub').textContent=clock(f.at)+' · '+(f.by_name||'');
    const p=$('sidePill');
    if(f.side){
      p.classList.remove('hide');
      p.textContent=(f.side==='L'?t('left'):f.side==='R'?t('right'):f.side==='B'?t('bottle'):t('solid'))
        +(f.ml?' · '+f.ml+'ml':'')+(f.minutes?' · '+f.minutes+t('m'):'');
    } else p.classList.add('hide');
    const pc=Math.min(1, el/((BABY.feed_interval||3)*HOUR));
    arc.style.strokeDashoffset=C*(1-pc);
    arc.setAttribute('stroke', pc>=1?'var(--clay)':'var(--gold)');
  }
  const te=todayEv();
  $('gF').textContent=te.filter(e=>e.kind==='feed').length;
  $('gD').textContent=te.filter(e=>e.kind==='diaper').length;
  $('gS').textContent=(te.filter(e=>e.kind==='sleep').reduce((a,e)=>a+(e.minutes||0),0)/60).toFixed(1)+'h';
}

/* ---------- NSSF ---------- */
function paintNssf(){
  let got=0, soon=0, lost=0;
  NSSF.forEach(v=>{
    const a=Number(v.amount||RIEL_PER_VISIT), s=nvState(v);
    if(s==='done') got+=a; else if(s==='missed') lost+=a; else soon+=a;
  });
  $('nGot').textContent=money(got);
  $('nSoon').textContent=money(soon);
  $('nLost').textContent=money(lost);

  const box=$('nssfList');
  if(!NSSF.length){
    box.innerHTML=`<div class="card"><div class="empty"><b>${t('noVisits')}</b>${t('noVisitsHint')}</div></div>`;
    return;
  }
  const CAT={prenatal:'prenatal',postnatal:'postnatal',child:'childV'};
  box.innerHTML=NSSF.map(v=>{
    const s=nvState(v), end=v.window_end||v.due_date;
    let cls='', tag='', sub='';
    if(s==='done'){ cls='gone'; tag=`<span class="st ok">${t('doneT')}</span>`; sub=dstr(v.done_at); }
    else if(s==='open'){
      cls='open';
      const left=dayGap(todayISO(), end);
      tag=`<span class="st now">${t('goToday')}</span>`;
      sub=t('openNow')+' · '+t('closesIn')+' '+(left<=0?'0':left)+t('d');
    }
    else if(s==='missed'){ cls='miss'; tag=`<span class="st miss">${t('missedT')}</span>`; sub=t('useBy')+' '+dstr(end); }
    else {
      const inD=dayGap(todayISO(), v.due_date);
      sub=t('opensIn')+' '+inD+t('d')+' · '+t('useBy')+' '+dstr(end);
    }
    if(v.is_estimate && s!=='done') tag+=`<span class="st est">${t('estT')}</span>`;

    let strip = '';
    // resolved rows carry no link — tap the row to change it
    if(s==='open'){
      // only while the visit can still be attended
      strip = `<div class="nvact">
        <button class="go" data-go="${v.id}">✓ ${t('wentB')}</button>
        <button class="no" data-no="${v.id}">✗ ${t('didNotB')}</button></div>`;
    }
    // 'soon' (still in the future) gets no buttons at all

    return `<div class="nv ${cls}">
      <button class="nvmain" data-nv="${v.id}">
        <div class="seq">${v.done_at?'✓':v.seq}</div>
        <div class="mn"><b>${dstr(v.due_date)}${tag}</b>
        <span>${t(CAT[v.category]||'childV')} · ${esc(sub)}</span></div>
        <div class="amt">${money(v.amount||RIEL_PER_VISIT)}</div>
      </button>${strip}</div>`;
  }).join('');
}

async function saveNssf(id){
  const due=$('nvDue').value; if(!due) return;
  let end=$('nvEnd').value;
  if(!end){ const d=new Date(due+'T00:00:00'); d.setDate(d.getDate()+7); end=d.toISOString().slice(0,10); }
  const patch={ due_date:due, window_end:end, category:document.querySelector('#nvCat .on').dataset.c,
                amount:+$('nvAmt').value||RIEL_PER_VISIT, is_estimate:false };
  closeSheet();
  if(id){
    await sb.from('nssf_visits').update(patch).eq('id',id);
    const v=NSSF.find(x=>x.id===id); Object.assign(v,patch);
  }else{
    const seq = NSSF.length? Math.max(...NSSF.map(x=>x.seq))+1 : 1;
    const {data,error}=await sb.from('nssf_visits')
      .insert(Object.assign({family_id:FAM.id,baby_id:BABY.id,seq},patch)).select().single();
    if(error){ toast(error.message); return; }
    NSSF.push(data);
  }
  NSSF.sort((a,b)=>a.due_date.localeCompare(b.due_date));
  paintNssf(); paintNext(); toast(t('saved'));
}

/* read the dates a parent types straight off their ប.ស.ស card */
function parseCardText(txt){
  const rx = /(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})/g;
  const iso = m => m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  const out = [];
  txt.split(/\n/).forEach(line=>{
    const found=[...line.matchAll(rx)];
    if(!found.length) return;
    const due = iso(found[0]);
    let end;
    if(found[1]) end = iso(found[1]);
    else { const d=new Date(due+'T00:00:00'); d.setDate(d.getDate()+7); end=d.toISOString().slice(0,10); }
    out.push({due,end});
  });
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}

/* keep one row per appointment date, preferring one already marked done */
async function dedupeNssf(){
  const seen={}, kill=[];
  [...NSSF].sort((a,b)=> (b.done_at?1:0)-(a.done_at?1:0)).forEach(v=>{
    if(seen[v.due_date]) kill.push(v.id); else seen[v.due_date]=true;
  });
  closeSheet();
  if(!kill.length){ toast(t('dedupeNone')); return; }
  await sb.from('nssf_visits').delete().in('id',kill);
  NSSF=NSSF.filter(v=>!kill.includes(v.id));
  renumber(); paintNssf(); paintNext();
  toast(kill.length+' '+t('dedupeDone'));
}
async function renumber(){
  NSSF.sort((a,b)=>a.due_date.localeCompare(b.due_date));
  for(let i=0;i<NSSF.length;i++){
    if(NSSF[i].seq!==i+1){ NSSF[i].seq=i+1; await sb.from('nssf_visits').update({seq:i+1}).eq('id',NSSF[i].id); }
  }
}

/* ============================================================
   Reading the card from a photo or PDF.
   Everything below runs inside the browser — the file is never
   sent to us or to anyone else.
============================================================ */
let IMP = { canvas:null, rot:0, src:null, rows:[] };

function loadScript(src){
  return new Promise((ok,bad)=>{
    if(document.querySelector(`script[src="${src}"]`)) return ok();
    const el=document.createElement('script'); el.src=src; el.onload=ok; el.onerror=bad;
    document.head.appendChild(el);
  });
}

function importSheet(){
  IMP={canvas:null,rot:0,src:null,rows:[]};
  openSheet(`<h3>${t('byFile')}</h3>
    <p class="note" style="font-size:12.5px">🔒 ${t('onDevice')}</p>
    <label class="f">${t('chooseFile')}</label>
    <input type="file" id="impFile" accept="image/*,application/pdf">
    <div id="impStage" style="margin-top:14px"></div>`);
  $('impFile').onchange = onPickFile;
}

async function onPickFile(e){
  const f=e.target.files && e.target.files[0]; if(!f) return;
  $('impStage').innerHTML=`<p class="note">${t('readingNow')}</p>`;
  try{
    if(f.type==='application/pdf'){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const buf=await f.arrayBuffer();
      const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
      const page=await pdf.getPage(1);
      const vp=page.getViewport({scale:2});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
      IMP.src=c;
    } else {
      IMP.src = await new Promise((ok,bad)=>{
        const img=new Image(); const url=URL.createObjectURL(f);
        img.onload=()=>{ URL.revokeObjectURL(url); ok(img); }; img.onerror=bad; img.src=url;
      });
    }
    IMP.rot=0; drawStage();
  }catch(err){ $('impStage').innerHTML=`<div class="err">${esc(err.message||'Could not open that file')}</div>`; }
}

function drawStage(){
  const src=IMP.src, sw=src.width||src.naturalWidth, sh=src.height||src.naturalHeight;
  const max=1500, scale=Math.min(1, max/Math.max(sw,sh));
  const w=Math.round(sw*scale), h=Math.round(sh*scale);
  const c=document.createElement('canvas');
  const turned = IMP.rot===90||IMP.rot===270;
  c.width = turned? h : w; c.height = turned? w : h;
  const x=c.getContext('2d');
  x.translate(c.width/2, c.height/2); x.rotate(IMP.rot*Math.PI/180);
  x.drawImage(src, -w/2, -h/2, w, h);
  IMP.canvas=c;
  $('impStage').innerHTML=`
    <div style="border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff">
      <img id="impPrev" style="width:100%;display:block" src="${c.toDataURL('image/jpeg',0.85)}">
    </div>
    <button class="btn ghost" id="impRot">↻ ${t('rotateImg')}</button>
    <button class="btn" id="impRead">${t('readDates')}</button>`;
  $('impRot').onclick=()=>{ IMP.rot=(IMP.rot+90)%360; drawStage(); };
  $('impRead').onclick=runOcr;
}

async function runOcr(){
  $('impStage').innerHTML=`<p class="note">${t('readingNow')}</p><div class="bar"><i id="ocrBar" style="width:5%"></i></div>`;
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    const worker = await window.Tesseract.createWorker('eng', 1, {
      logger: m => { if(m.progress) { const b=$('ocrBar'); if(b) b.style.width=Math.round(m.progress*100)+'%'; } }
    });
    await worker.setParameters({ tessedit_char_whitelist:'0123456789/-. ' });
    const { data } = await worker.recognize(IMP.canvas);
    await worker.terminate();
    IMP.rows = parseCardText(data.text || '').slice(0,20);
    showFound();
  }catch(err){
    $('impStage').innerHTML=`<div class="err">${esc(err.message||'Could not read the image')}</div>
      <button class="btn ghost" id="impBack">${t('back')}</button>`;
    $('impBack').onclick=importSheet;
  }
}

function showFound(){
  if(!IMP.rows.length){
    $('impStage').innerHTML=`<div class="err">${t('noDates')}</div>
      <button class="btn ghost" id="impBack">${t('back')}</button>`;
    $('impBack').onclick=importSheet; return;
  }
  $('impStage').innerHTML=`<p class="note" style="font-size:12.5px">⚠ ${t('foundDates')}</p>
    <div id="impRows"></div>
    <button class="btn" id="impSave">${t('saveVisits')}</button>`;
  paintFound();
  $('impSave').onclick=saveFound;
}
function paintFound(){
  $('impRows').innerHTML = IMP.rows.map((r,i)=>`
    <div class="row"><div class="ic">${i+1}</div>
      <div class="bd"><b>${dstr(r.due)}</b><span>${t('useBy')} ${dstr(r.end)}</span></div>
      <button class="mini warn" data-impdel="${i}">×</button></div>`).join('');
}

async function saveFound(){
  closeSheet();
  const have = new Set(NSSF.map(v=>v.due_date));
  const fresh = IMP.rows.filter(r=>!have.has(r.due));
  const skipped = IMP.rows.length - fresh.length;
  if(!fresh.length){ toast(skipped+' '+t('skipped')); return; }

  const base = NSSF.length;
  const payload = fresh.map((r,i)=>({
    family_id:FAM.id, baby_id:BABY.id, seq:base+i+1,
    category: (base+i) < 2 ? 'postnatal' : 'child',
    due_date:r.due, window_end:r.end,
    amount:RIEL_PER_VISIT, is_estimate:false
  }));
  const {data,error}=await sb.from('nssf_visits').insert(payload).select();
  if(error){ toast(error.message); return; }
  NSSF=NSSF.concat(data);
  await renumber(); paintNssf(); paintNext();
  toast(data.length+' '+t('quickAdded') + (skipped? ' · '+skipped+' '+t('skipped') : ''));
}

async function setVisit(id, patch){
  const v=NSSF.find(x=>x.id===id); if(!v) return;
  closeSheet();
  Object.assign(v, patch);
  paintNssf(); paintNext();
  const {error}=await sb.from('nssf_visits').update(patch).eq('id',id);
  if(error){ toast(error.message); return; }
  if(patch.done_at) toast('✓ '+money(v.amount||RIEL_PER_VISIT)+' '+t('gotAmt'));
}

  if(el.dataset.used){ await sb.from('milk_batches').update({used_at:new Date().toISOString()}).eq('id',el.dataset.used);

    const o=['freezer','fridge','thawed','room']; b.place=o[(o.indexOf(b.place)+1)%o.length]; b.place_at=new Date().toISOString();
    await sb.from('milk_batches').update({place:b.place,place_at:b.place_at}).eq('id',b.id); paintMilk(); return;
  }
  if(el.dataset.lbl){ const b=MILK.find(x=>x.id===el.dataset.lbl); if(b) labelSheet(b); return; }
  if(el.dataset.delev){ await sb.from('events').delete().eq('id',el.dataset.delev); EV=EV.filter(x=>x.id!==el.dataset.delev); paint(); return; }
  if(el.dataset.delap){ await sb.from('appointments').delete().eq('id',el.dataset.delap); APPTS=APPTS.filter(x=>x.id!==el.dataset.delap); paintAppts(); return; }
  if(el.dataset.delgr){ await sb.from('growth').delete().eq('id',el.dataset.delgr); GROWTH=GROWTH.filter(x=>x.id!==el.dataset.delgr); paintGrowth(); return; }
});

$('nightBtn').onclick=()=>{
  const cur=localStorage.getItem('mc.night')||'auto';
  const nx=cur==='auto'?'on':cur==='on'?'off':'auto';
  localStorage.setItem('mc.night',nx); applyNight();
};
function applyNight(){
  const mode=localStorage.getItem('mc.night')||'auto';
  const h=new Date().getHours();
  const on = mode==='on' || (mode==='auto' && (h>=19||h<6));
  document.body.classList.toggle('night',on);
  $('nightBtn').textContent = mode==='auto'?'☾':mode==='on'?'●':'☀';
}

/* ============================================================
   BOOT
============================================================ */
async function boot(){
  paintLang(); applyNight();
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $('auth').classList.remove('hide'); $('app').classList.add('hide'); $('nav').classList.add('hide'); authView('signin'); return; }
  ME = session.user;

  let {data:prof} = await sb.from('profiles').select('*').eq('id',ME.id).maybeSingle();
  if(!prof){ const r=await sb.from('profiles').insert({id:ME.id,display_name:ME.email.split('@')[0]}).select().single(); prof=r.data; }
  PROFILE = prof;

  const {data:mem} = await sb.from('family_members').select('family_id, families(*)').limit(1);
  if(!mem || !mem.length){ $('auth').classList.remove('hide'); setupView(); return; }
  FAM = mem[0].families;

  let {data:babies} = await sb.from('babies').select('*').eq('family_id',FAM.id).order('created_at').limit(1);
  if(!babies || !babies.length){
    const r = await sb.from('babies').insert({family_id:FAM.id,name:'Baby'}).select().single();
    babies=[r.data];
  }
  BABY = babies[0];

  $('sName').value=BABY.name; $('sDob').value=BABY.dob||''; $('sGap').value=BABY.feed_interval||3;
  $('auth').classList.add('hide'); $('app').classList.remove('hide'); $('nav').classList.remove('hide');
  await loadAll(); paint(); watch(); loadTg();
}
boot();
setInterval(()=>{ if(BABY){ paintHero(); paintTaps(); paintNext(); paintMilk(); paintNssf(); } applyNight(); }, 20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && BABY){ refresh(); loadTg(); } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
